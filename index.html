<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI & Healthy Weight Range Health Tool</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen p-4">
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-bold text-blue-800 mb-1">BMI & Healthy Weight Range</h1>
  <p class="text-xs text-gray-500 mb-5 italic">This tool is for informational purposes only and does not constitute medical advice.</p>

  <!-- Unit Toggle -->
  <div class="bg-white rounded-xl shadow p-5 mb-4">
    <div class="flex gap-3 mb-4" role="group" aria-label="Unit system">
      <button id="btn-metric" class="flex-1 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-400">Metric (cm / kg)</button>
      <button id="btn-imperial" class="flex-1 py-2 rounded-lg text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400">Imperial (ft-in / lbs)</button>
    </div>

    <!-- Metric inputs -->
    <div id="metric-inputs" class="space-y-3">
      <div>
        <label for="height-cm" class="block text-sm font-medium text-gray-600 mb-1">Height (cm)</label>
        <input id="height-cm" type="number" min="50" max="250" value="170" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div>
        <label for="weight-kg" class="block text-sm font-medium text-gray-600 mb-1">Weight (kg)</label>
        <input id="weight-kg" type="number" min="1" max="500" value="70" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
    </div>

    <!-- Imperial inputs -->
    <div id="imperial-inputs" class="hidden space-y-3">
      <div class="flex gap-2">
        <div class="flex-1">
          <label for="height-ft" class="block text-sm font-medium text-gray-600 mb-1">Height (ft)</label>
          <input id="height-ft" type="number" min="1" max="8" value="5" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <div class="flex-1">
          <label for="height-in" class="block text-sm font-medium text-gray-600 mb-1">Height (in)</label>
          <input id="height-in" type="number" min="0" max="11" value="7" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
      </div>
      <div>
        <label for="weight-lbs" class="block text-sm font-medium text-gray-600 mb-1">Weight (lbs)</label>
        <input id="weight-lbs" type="number" min="1" max="1000" value="154" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="bg-white rounded-xl shadow p-5 mb-4">
    <div class="flex items-center gap-4 mb-4">
      <div class="text-5xl font-bold" id="bmi-value">--</div>
      <div>
        <div class="text-lg font-semibold" id="bmi-category">--</div>
        <div class="text-sm text-gray-500" id="healthy-range">Healthy range: --</div>
      </div>
    </div>

    <!-- Visual Gauge -->
    <div class="mb-2">
      <div class="relative h-5 rounded-full overflow-hidden flex">
        <div class="flex-1 bg-blue-300" title="Underweight"></div>
        <div class="flex-1 bg-green-400" title="Normal"></div>
        <div class="flex-1 bg-yellow-400" title="Overweight"></div>
        <div class="flex-1 bg-red-400" title="Obese"></div>
      </div>
      <div class="relative h-4 mt-1" id="gauge-track">
        <div id="gauge-needle" class="absolute top-0 w-3 h-3 bg-gray-800 rounded-full transform -translate-x-1/2 transition-all duration-500" style="left:0%"></div>
      </div>
      <div class="flex text-xs text-gray-400 justify-between mt-1">
        <span>16</span><span>18.5</span><span>25</span><span>30</span><span>40+</span>
      </div>
    </div>
    <div class="flex text-xs justify-between text-gray-500 mt-1">
      <span class="text-blue-600">Underweight</span>
      <span class="text-green-600">Normal</span>
      <span class="text-yellow-600">Overweight</span>
      <span class="text-red-600">Obese</span>
    </div>
  </div>

  <p class="text-xs text-gray-400 text-center">BMI is a screening tool, not a diagnostic measure. Consult a healthcare provider for personalized advice.</p>
</div>

<script>
let useMetric = true;

function getHeightM() {
  if (useMetric) {
    return (parseFloat(document.getElementById('height-cm').value) || 0) / 100;
  } else {
    const ft = parseFloat(document.getElementById('height-ft').value) || 0;
    const inch = parseFloat(document.getElementById('height-in').value) || 0;
    return (ft * 12 + inch) * 0.0254;
  }
}

function getWeightKg() {
  if (useMetric) {
    return parseFloat(document.getElementById('weight-kg').value) || 0;
  } else {
    return (parseFloat(document.getElementById('weight-lbs').value) || 0) * 0.453592;
  }
}

function calcBMI() {
  const h = getHeightM();
  const w = getWeightKg();
  if (!h || !w) return null;
  return w / (h * h);
}

function bmiCategory(bmi) {
  if (bmi < 18.5) return { label: 'Underweight', color: 'text-blue-600' };
  if (bmi < 25)   return { label: 'Normal weight', color: 'text-green-600' };
  if (bmi < 30)   return { label: 'Overweight', color: 'text-yellow-600' };
  return { label: 'Obese', color: 'text-red-600' };
}

function healthyRange() {
  const h = getHeightM();
  if (!h) return '--';
  const lo = (18.5 * h * h);
  const hi = (24.9 * h * h);
  if (useMetric) return `${lo.toFixed(1)}–${hi.toFixed(1)} kg`;
  return `${(lo/0.453592).toFixed(0)}–${(hi/0.453592).toFixed(0)} lbs`;
}

function bmiToGaugePercent(bmi) {
  // Map 16-40 range to 0-100%
  const min = 16, max = 40;
  return Math.min(100, Math.max(0, (bmi - min) / (max - min) * 100));
}

function update() {
  const bmi = calcBMI();
  if (!bmi || bmi < 1) {
    document.getElementById('bmi-value').textContent = '--';
    document.getElementById('bmi-category').textContent = '--';
    document.getElementById('bmi-category').className = 'text-lg font-semibold text-gray-500';
    document.getElementById('healthy-range').textContent = 'Healthy range: --';
    document.getElementById('gauge-needle').style.left = '0%';
    return;
  }
  const cat = bmiCategory(bmi);
  document.getElementById('bmi-value').textContent = bmi.toFixed(1);
  document.getElementById('bmi-value').className = 'text-5xl font-bold ' + cat.color;
  document.getElementById('bmi-category').textContent = cat.label;
  document.getElementById('bmi-category').className = 'text-lg font-semibold ' + cat.color;
  document.getElementById('healthy-range').textContent = 'Healthy range: ' + healthyRange();
  document.getElementById('gauge-needle').style.left = bmiToGaugePercent(bmi) + '%';
}

document.getElementById('btn-metric').addEventListener('click', () => {
  useMetric = true;
  document.getElementById('metric-inputs').classList.remove('hidden');
  document.getElementById('imperial-inputs').classList.add('hidden');
  document.getElementById('btn-metric').className = 'flex-1 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-400';
  document.getElementById('btn-imperial').className = 'flex-1 py-2 rounded-lg text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400';
  update();
});

document.getElementById('btn-imperial').addEventListener('click', () => {
  useMetric = false;
  document.getElementById('imperial-inputs').classList.remove('hidden');
  document.getElementById('metric-inputs').classList.add('hidden');
  document.getElementById('btn-imperial').className = 'flex-1 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-400';
  document.getElementById('btn-metric').className = 'flex-1 py-2 rounded-lg text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400';
  update();
});

['height-cm','weight-kg','height-ft','height-in','weight-lbs'].forEach(id => {
  document.getElementById(id).addEventListener('input', update);
});

update();
</script>
</body>
</html>
